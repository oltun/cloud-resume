version: 0.2

phases:
  build:
    commands:
      - bash scripts/check.sh
      - python3 -c "import zipfile; z = zipfile.ZipFile('function.zip', 'w', zipfile.ZIP_DEFLATED); z.write('backend/lambda_function.py', 'lambda_function.py'); z.close()"
      - aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://function.zip --region eu-north-1
      - aws s3 cp index.html "s3://$SITE_BUCKET/index.html" --region eu-north-1
      - aws s3 cp style.css "s3://$SITE_BUCKET/style.css" --region eu-north-1
      - aws s3 cp favicon.png "s3://$SITE_BUCKET/favicon.png" --region eu-north-1
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/" "/index.html" "/style.css" "/favicon.png"